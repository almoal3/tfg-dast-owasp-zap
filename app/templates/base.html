<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{{ title or "Aplicación vulnerable" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Aplicación vulnerable</h1>
        <nav>
            <a href="{{ url_for('index') }}">Inicio</a>
            <a href="{{ url_for('register') }}">Registro</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('profile') }}">Perfil</a>
            <a href="{{ url_for('comments') }}">Comentarios</a>
            <a href="{{ url_for('search') }}">Buscar</a>
            <a href="{{ url_for('admin') }}">Admin</a>
            <a href="{{ url_for('logout') }}">Salir</a>
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
